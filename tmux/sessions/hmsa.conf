rename-session "HMSA"

rename-window "intranet"
send-keys 'cd intranet && ls -l' Enter

new-window -n "runners"
send-keys 'cd intranet && cd master && ./run' Enter
split-window -h
send-keys 'cd intranet && cd master && ./run-cache' Enter
select-pane -t 1

new-window -n "reports"
send-keys 'cd reports && ls -l' Enter
split-window -h -l 80
send-keys 'cd reports && ./run list' Enter
select-pane -t 1

select-window -t 1
